name: Build 002 exact registry assembly
on:
  push:
    branches: [build002-publication-probe]
    paths:
      - .build002-transfer/assemble-registry.trigger
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify exact registry blob
        shell: bash
        run: |
          set -euo pipefail
          cat .build002-transfer/registry.{0..9}.b64 > /tmp/registry.b64
          base64 -d /tmp/registry.b64 > src/SHELLeye.Kernel/LinuxProviderRegistry.cs
          actual="$(git hash-object src/SHELLeye.Kernel/LinuxProviderRegistry.cs)"
          echo "registry blob=$actual"
          test "$actual" = "702b54d25b24ca7815e6dc8736e752a227a23b43"
          git config user.name "StealthEyeLLC Build 002 Assembler"
          git config user.email "actions@users.noreply.github.com"
          git add src/SHELLeye.Kernel/LinuxProviderRegistry.cs
          git commit -m "Assemble exact Build 002 Linux registry blob"
          git push
