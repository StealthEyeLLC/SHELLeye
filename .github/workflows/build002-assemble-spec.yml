name: Build 002 exact spec assembly
on:
  push:
    branches: [build002-publication-probe]
    paths:
      - .build002-transfer/assemble-spec.trigger
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify exact spec blob
        shell: bash
        run: |
          set -euo pipefail
          cat .build002-transfer/spec.0.b64 .build002-transfer/spec.1.b64 .build002-transfer/spec.2.b64 .build002-transfer/spec.3.b64 .build002-transfer/spec.4.b64 .build002-transfer/spec.5.b64 .build002-transfer/spec.6.b64 .build002-transfer/spec.7.b64 > /tmp/spec.b64
          base64 -d /tmp/spec.b64 > docs/11-BUILD-002-PROVIDER-NEUTRALITY-SPEC.md
          actual="$(git hash-object docs/11-BUILD-002-PROVIDER-NEUTRALITY-SPEC.md)"
          test "$actual" = "bfc4c66d1df605b90a4c3fe15bf18c3482c12fcb"
          git config user.name "StealthEyeLLC Build 002 Assembler"
          git config user.email "actions@users.noreply.github.com"
          git add docs/11-BUILD-002-PROVIDER-NEUTRALITY-SPEC.md
          git commit -m "Assemble exact Build 002 spec blob"
          git push
